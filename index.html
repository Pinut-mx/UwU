<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Me quieres?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050505;
        }

        /* --- PANTALLA 1: FONDO Y FLORES --- */
        #screen1 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a0508 0%, #050505 80%);
            transition: opacity 0.8s ease-in-out;
            z-index: 10;
        }

        .lycoris-side {
            position: absolute;
            bottom: 0;
            width: 300px;
            height: 450px;
            pointer-events: none;
            opacity: 0.85;
            filter: drop-shadow(0 0 15px rgba(220, 20, 60, 0.6));
        }

        .lycoris-left { left: 0; }
        .lycoris-right { right: 0; transform: scaleX(-1); }

        /* Estilos del Sobre y Carta */
        .card-container {
            position: relative;
            width: 320px;
            height: 220px;
            cursor: pointer;
            perspective: 1000px;
        }

        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #7a0c1e;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(220, 20, 60, 0.3);
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 120px solid #9e1027;
            transform-origin: top;
            transition: transform 0.6s ease 0.2s, z-index 0.2s 0.4s;
            z-index: 4;
        }

        .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid #5e0816;
            border-right: 160px solid #5e0816;
            border-bottom: 110px solid #6b0a1a;
            border-top: 110px solid transparent;
            border-radius: 0 0 8px 8px;
            z-index: 3;
        }

        .letter {
            position: absolute;
            bottom: 10px;
            left: 15px;
            width: 290px;
            height: 200px;
            background: #fffaf0;
            border-radius: 6px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.27) 0.6s, z-index 0.1s 0.6s;
            z-index: 2;
            text-align: center;
        }

        .letter h2 {
            color: #8b0000;
            font-size: 26px;
            margin-bottom: 20px;
            font-family: 'Georgia', serif;
        }

        /* Contenedor horizontal para SÍ y NO */
        .buttons-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 25px;
            width: 100%;
        }

        .btn {
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        .btn-yes {
            background-color: #ff3366;
            color: white;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-yes:hover {
            background-color: #e60039;
            transform: scale(1.1);
        }

        .btn-no {
            background-color: #4a4a4a;
            color: white;
            transition: left 0.25s ease-out, top 0.25s ease-out;
            z-index: 999;
        }

        /* Animación de apertura */
        .card-container.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .card-container.open .letter {
            transform: translateY(-140px);
            height: 220px;
            z-index: 5;
        }

        .click-hint {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: #ff4d6d;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-5px); }
        }

        /* --- PANTALLA 2: LLUVIAS DE CORAZONES --- */
        #screen2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            z-index: 20;
            overflow: hidden;
        }

        #screen2.active {
            opacity: 1;
            pointer-events: auto;
        }

        .love-text {
            font-size: 80px;
            font-weight: 900;
            color: #ff2a6d;
            text-shadow: 0 10px 25px rgba(255, 42, 109, 0.3);
            z-index: 30;
            animation: bounce 1s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5);
        }

        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        .heart {
            position: absolute;
            top: -50px;
            user-select: none;
            pointer-events: none;
            z-index: 25;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
        }
    </style>
</head>
<body>

    <div id="screen1">
        <!-- SVG Flores Izquierda -->
        <svg class="lycoris-side lycoris-left" viewBox="0 0 200 300">
            <path d="M 20 300 Q 60 200 40 100" stroke="#1c3d14" stroke-width="4" fill="none"/>
            <path d="M 10 300 Q 80 180 90 80" stroke="#1c3d14" stroke-width="3" fill="none"/>
            <g transform="translate(40,100)">
                <path d="M0,0 Q-30,-40 -60,-20 Q-20,0 0,0" fill="#dc143c"/>
                <path d="M0,0 Q30,-50 60,-30 Q20,5 0,0" fill="#ff1744"/>
                <path d="M0,0 Q-10,-60 -20,-80 Q0,-30 0,0" fill="#b71c1c"/>
                <path d="M0,0 Q-40,-70 -80,-60" stroke="#ff4d6d" stroke-width="1.5" fill="none"/>
                <circle cx="-80" cy="-60" r="2" fill="#ff4d6d"/>
                <path d="M0,0 Q-20,-90 -40,-100" stroke="#ff4d6d" stroke-width="1.5" fill="none"/>
                <circle cx="-40" cy="-100" r="2" fill="#ff4d6d"/>
                <path d="M0,0 Q20,-90 50,-95" stroke="#ff4d6d" stroke-width="1.5" fill="none"/>
                <circle cx="50" cy="-95" r="2" fill="#ff4d6d"/>
            </g>
        </svg>

        <!-- SVG Flores Derecha -->
        <svg class="lycoris-side lycoris-right" viewBox="0 0 200 300">
            <path d="M 20 300 Q 60 200 40 100" stroke="#1c3d14" stroke-width="4" fill="none"/>
            <path d="M 10 300 Q 80 180 90 80" stroke="#1c3d14" stroke-width="3" fill="none"/>
            <g transform="translate(40,100)">
                <path d="M0,0 Q-30,-40 -60,-20 Q-20,0 0,0" fill="#dc143c"/>
                <path d="M0,0 Q30,-50 60,-30 Q20,5 0,0" fill="#ff1744"/>
                <path d="M0,0 Q-10,-60 -20,-80 Q0,-30 0,0" fill="#b71c1c"/>
                <path d="M0,0 Q-40,-70 -80,-60" stroke="#ff4d6d" stroke-width="1.5" fill="none"/>
                <circle cx="-80" cy="-60" r="2" fill="#ff4d6d"/>
                <path d="M0,0 Q20,-90 50,-95" stroke="#ff4d6d" stroke-width="1.5" fill="none"/>
                <circle cx="50" cy="-95" r="2" fill="#ff4d6d"/>
            </g>
        </svg>

        <!-- Sobre -->
        <div class="card-container" id="cardContainer" onclick="openEnvelope()">
            <div class="envelope">
                <div class="flap"></div>
                <div class="pocket"></div>
                <div class="letter">
                    <h2>¿Me quieres?</h2>
                    <div class="buttons-container">
                        <button class="btn btn-yes" onclick="sayYes(event)">SÍ</button>
                        <button class="btn btn-no" id="btnNo">NO</button>
                    </div>
                </div>
            </div>
            <div class="click-hint" id="clickHint">Haz clic para abrir el sobre</div>
        </div>
    </div>

    <!-- PANTALLA 2 -->
    <div id="screen2">
        <h1 class="love-text">YO MÁS</h1>
    </div>

    <script>
        let isOpen = false;
        let isMoving = false;
        const btnNo = document.getElementById('btnNo');

        function openEnvelope() {
            if (!isOpen) {
                document.getElementById('cardContainer').classList.add('open');
                document.getElementById('clickHint').style.display = 'none';
                isOpen = true;
            }
        }

        function moveNoButton() {
            if (!isOpen) return;

            // Fijamos posición absoluta en pantalla al primer contacto
            if (!isMoving) {
                const rect = btnNo.getBoundingClientRect();
                btnNo.style.position = 'fixed';
                btnNo.style.left = rect.left + 'px';
                btnNo.style.top = rect.top + 'px';
                isMoving = true;
            }

            // --- LÍMITES DEL RECUADRO AZUL CENTRAL ---
            const boxWidth = Math.min(650, window.innerWidth * 0.7);  
            const boxHeight = Math.min(450, window.innerHeight * 0.6); 

            const minX = (window.innerWidth - boxWidth) / 2;
            const maxX = minX + boxWidth - btnNo.offsetWidth;

            const minY = (window.innerHeight - boxHeight) / 2;
            const maxY = minY + boxHeight - btnNo.offsetHeight;

            // Cálculo de coordenadas aleatorias dentro de la caja azul
            const randomX = Math.floor(Math.random() * (maxX - minX)) + minX;
            const randomY = Math.floor(Math.random() * (maxY - minY)) + minY;

            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;
        }

        btnNo.addEventListener('mouseenter', moveNoButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        function sayYes(event) {
            event.stopPropagation();
            
            const screen1 = document.getElementById('screen1');
            const screen2 = document.getElementById('screen2');
            btnNo.style.display = 'none';

            screen1.style.opacity = '0';
            setTimeout(() => {
                screen1.style.display = 'none';
                screen2.classList.add('active');
                startHeartRain();
            }, 800);
        }

        function startHeartRain() {
            const screen2 = document.getElementById('screen2');
            const hearts = ['♥', '💖', '💗', '💕', '🌸', '✨'];

            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
                
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
                heart.style.color = ['#ff2a6d', '#ff69b4', '#ff8da1', '#ff1493'][Math.floor(Math.random() * 4)];

                screen2.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 100);
        }
    </script>
</body>
</html>
